# CI gates: the same checks the process law demands before any commit,
# enforced by machinery on every push. Smoke boots the whole app
# headlessly on both platforms; Windows joined after issue 1 proved a
# renderer can break there while macOS stays green.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read only: nothing here writes to the repo, and every action is pinned
# to a commit so a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: smoke
        run: npm run smoke
