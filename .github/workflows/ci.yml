# CI gates: the same checks the process law demands before any commit,
# enforced by machinery on every push. Smoke boots the whole app
# headlessly on both platforms; Windows joined after issue 1 proved a
# renderer can break there while macOS stays green.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: smoke
        run: npm run smoke
