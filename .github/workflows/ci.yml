# CI gates: the same checks the process law demands before any commit,
# enforced by machinery on every push. Smoke boots the whole app
# headlessly on both platforms; Windows joined after issue 1 proved a
# renderer can break there while macOS stays green.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read only: nothing here writes to the repo, and every action is pinned
# to a commit so a moved tag cannot change what runs.
permissions:
  contents: read

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: smoke
        run: npm run smoke
